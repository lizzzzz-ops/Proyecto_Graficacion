<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Recorrido por Sistemas
    </title>

    <link rel="stylesheet"
          href="sistemas.css">

</head>

<body>

    <!-- GRID -->

    <div class="grid"></div>

    <!-- HEADER -->

    <header class="topbar">

        <div class="logo">
            🖥️ RECORRIDO POR SISTEMAS
        </div>

        <button class="btn-volver"
                id="volverBtn">

            ⬅ Volver

        </button>

    </header>

    <!-- CONTENIDO -->

    <main class="campus-main">

        <div class="campus-layout">

            <!-- IZQUIERDA -->

            <div class="map-contenedor">

                <img id="tourImage"
                     class="campus-img"
                     src="img/edificio-sistemas/lobby.jpg">

            </div>

            <!-- DERECHA -->

            <div class="columna-derecha">

                <!-- BARRITA -->

                <div class="mascota-bar">

                    <img src="img/pelicano.png"
                         class="mascota-mini">

                    <div class="bocadillo">

                        <h2 id="tituloLugar">

                            Lobby Principal

                        </h2>

                        <p id="descripcionLugar">

                            Bienvenido al edificio de Sistemas.
                            Aqui iniciaremos el recorrido virtual.

                        </p>

                    </div>

                    <button class="btn-voz"
                            id="audioBtn">

                        🔊

                    </button>

                </div>

                <!-- BOTONES -->

                <div class="controls">

                    <button id="prevBtn">

                        ⬅ Anterior

                    </button>

                    <button id="nextBtn">

                        Siguiente ➡

                    </button>

                </div>

            </div>

        </div>

    </main>

    <script src="sistemas.js"></script>

</body>
</html>
